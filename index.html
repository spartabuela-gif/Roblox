[24/8, 2:44 p.m.] JA¥KO: <body>
    <div class="rbx-header">
        <div class="rbx-left"><div class="rbx-icon-menu"></div><div class="rbx-logo"></div></div>
        <div class="rbx-right">
            <div class="rbx-icon-search"></div>
            <div class="rbx-robux-container" onclick="mostrarCompra()">
                <div class="rbx-robux-icon"></div>
                <span class="rbx-robux-amount" id="balance-num">100,000</span>
            </div>
            <div class="rbx-icon-notif"></div>
        </div>
    </div>
    <div class="rbx-content">
        <div class="user-greeting">Inicio</div>
        <div class="panel-plus">
            <div class="panel-title">Donación Directa</div>
            <div class="form-group"><label>Usuario destino</label><input type="text" id="target-player" placeholder="Ej: @TuAmigo"></div>
            <div class="form-group"><label>Cantidad de Robux</label><input type="number" id="transfer-val" placeholder="0"></div>
            <button class="btn-submit" onclick="procesarDonacion()">Enviar por Servidor</button>
        </div>
    </div>
    <div class="payment-overlay" id="pay-screen">
        <div class="payment-modal">
            <div class="pay-top"><span class="pay-cancel" onclick="ocultarCompra()">Cancelar</span><span class="pay-title">Confirmación de Pago</span><span style="opacity:0;">Ok</span></div>
            <div class="pay-details"><span class="item-info">Paquete Especial (+100,000 R$)</span><span class="item-price">GRATIS</span></div>
            <div class="biometric-box">
                <div class="fingerprint-btn" id="biometric-trigger" onclick="simularHuella()"></div>
                <div class="pay-status-text" id="status-label">Coloca tu huella digital para autorizar la recarga</div>
            </div>
        </div>
    </div>
    <script>
        let robuxBalance = 100000;
        function refreshBalance() { document.getElementById('balance-num').textContent = robuxBalance.toLocaleString(); }
        function procesarDonacion() {
            const user = document.getElementById('target-player').value.trim();
            const val = parseInt(document.getElementById('transfer-val').value);
            if (!user) { alert("Introduce el nombre de usuario de tu amigo."); return; }
            if (isNaN(val) || val <= 0) { alert("Cantidad no válida."); return; }
            if (val > robuxBalance) { alert("Saldo insuficiente. Toca tus Robux arriba para recargar."); return; }
            robuxBalance -= val; refreshBalance();
            alert(`¡Donación Completa!\nSe han enviado ${val.toLocaleString()} Robux a ${user}.`);
        }
        function mostrarCompra() { document.getElementById('pay-screen').classList.add('active'); }
        function ocultarCompra() {
            document.getElementById('pay-screen').classList.remove('active');
            const btn = document.getElementById('biometric-trigger'); btn.className = "fingerprint-btn";
            document.getElementById('status-label').textContent = "Coloca tu huella digital para autorizar la recarga";
            document.getElementById('status-label').style.color = "#8E8E93";
        }
        function simularHuella() {
            const btn = document.getElementById('biometric-trigger'); const lbl = document.getElementById('status-label');
            if (btn.classList.contains('processing') || btn.classList.contains('success')) return;
            btn.classList.add('processing'); lbl.textContent = "Verificando huella..."; lbl.style.color = "#FFD60A";
            setTimeout(() => {
                btn.classList.remove('processing'); btn.classList.add('success');
                lbl.textContent = "¡Compra Exitosa!"; lbl.style.color = "#30D158";
                robuxBalance += 100000; refreshBalance();
                setTimeout(() => { ocultarCompra(); }, 1000);
            }, 1800);
        }
    </script>
</body>
